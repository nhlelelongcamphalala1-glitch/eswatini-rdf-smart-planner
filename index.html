<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Eswatini RDF Smart Planner</title>
                <style>
                        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
                                .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                                        h1, h2 { text-align: center; color: #0056b3; }
                                                .form-group { margin-bottom: 15px; }
                                                        label { display: block; margin-bottom: 5px; font-weight: bold; }
                                                                input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
                                                                        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
                                                                                button:hover { background-color: #004094; }
                                                                                        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
                                                                                                .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
                                                                                                        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
                                                                                                                pre { background: #eee; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
                                                                                                                    </style>
                                                                                                                    </head>
                                                                                                                    <body>

                                                                                                                    <div class="container">
                                                                                                                        <h1>Eswatini RDF Smart Planner</h1>
                                                                                                                            <p style="text-align:center; font-size:12px; color:#666;">Form Standard: MNZ 1004</p>
                                                                                                                                
                                                                                                                                    <h2>1. Applicant Eligibility</h2>
                                                                                                                                        <div class="form-group">
                                                                                                                                                <label for="groupName">Name of Swazi Organized Group:</label>
                                                                                                                                                        <input type="text" id="groupName" value="Sukuma Mswati Poultry Co-operative">
                                                                                                                                                            </div>
                                                                                                                                                                <div class="form-group">
                                                                                                                                                                        <label for="memberCount">Total Number of Registered Members:</label>
                                                                                                                                                                                <input type="number" id="memberCount" value="12">
                                                                                                                                                                                    </div>
                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                <label for="projectDesc">Project Description (e.g. Poultry Production):</label>
                                                                                                                                                                                                        <input type="text" id="projectDesc" value="Poultry Expansion Project">
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                <h2>2. Budget & Contributions</h2>
                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                            <label for="localCash">Community Cash Saved/Spent (E):</label>
                                                                                                                                                                                                                                    <input type="number" id="localCash" value="2500">
                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                    <label for="laborers">Number of Members Donating Labor:</label>
                                                                                                                                                                                                                                                            <input type="number" id="laborers" value="12">
                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                            <label for="laborDays">Average Volunteer Days per Member:</label>
                                                                                                                                                                                                                                                                                    <input type="number" id="laborDays" value="10">
                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                    <label for="materials">Requested RDF Building Materials (E):</label>
                                                                                                                                                                                                                                                                                                            <input type="number" id="materials" value="35000">
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                            <label for="equipment">Requested RDF Equipment & Fittings (E):</label>
                                                                                                                                                                                                                                                                                                                                    <input type="number" id="equipment" value="15000">
                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                    <label for="advisory">Requested RDF Contractors/Advisory Costs (E):</label>
                                                                                                                                                                                                                                                                                                                                                            <input type="number" id="advisory" value="5000">
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <h2>3. Business Projections</h2>
                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                <label for="units">Estimated Units/Products Sold Per Month:</label>
                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="units" value="500">
                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                        <label for="price">Selling Price Per Unit (E):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                <input type="number" id="price" value="120">
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="transport">Monthly Transport Cost (E):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="transport" value="1500">
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="opLabour">Monthly Operational Running Labour Cost (E):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="number" id="opLabour" value="4000">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="otherExp">Other Monthly Operational Overhead (E):</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="otherExp" value="1000">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="calculateWebRDF()">Verify & Generate Business Plan</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="resultBox" class="result-box"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function calculateWebRDF() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 1. Get Values from Web Form
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const groupName = document.getElementById('groupName').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const memberCount = parseInt(document.getElementById('memberCount').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const projectDesc = document.getElementById('projectDesc').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const localCash = parseFloat(document.getElementById('localCash').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const laborers = parseInt(document.getElementById('laborers').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const laborDays = parseInt(document.getElementById('laborDays').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const materials = parseFloat(document.getElementById('materials').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const equipment = parseFloat(document.getElementById('equipment').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const advisory = parseFloat(document.getElementById('advisory').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const units = parseFloat(document.getElementById('units').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const price = parseFloat(document.getElementById('price').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const transport = parseFloat(document.getElementById('transport').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const opLabour = parseFloat(document.getElementById('opLabour').value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const otherExp = parseFloat(document.getElementById('otherExp').value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const DAILY_RATE = 65.00;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let eligible = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let outputHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // 2. Perform Eligibility & Threshold Check Logic
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const laborValue = laborers * laborDays * DAILY_RATE;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const totalLocal = localCash + laborValue;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const totalRDF = materials + equipment + advisory;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const grandTotal = totalLocal + totalRDF;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const communityPercentage = (totalLocal / grandTotal) * 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const grossIncome = units * price;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const totalExpenses = transport + opLabour + otherExp;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const netProfit = grossIncome - totalExpenses;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    outputHTML += "<h3>--- VERIFICATION ANALYSIS ---</h3>";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Gatekeeper Check: 10 Members Rule (Page 14)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (memberCount < 10) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    outputHTML += `<p>❌ <strong>CRITICAL FAILURE:</strong> Only ${memberCount} members. Form MNZ 1004 rules require a minimum of 10 members to clear administrative checks.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            eligible = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        outputHTML += `<p>✅ <strong>ADMINISTRATIVE GATEWAY:</strong> Group member count satisfies community thresholds.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Gatekeeper Check: 10% Local Contribution Rule (Page 6)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (communityPercentage < 10.0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let deficit = (grandTotal * 0.10) - totalLocal;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    outputHTML += `<p>❌ <strong>FINANCIAL FAILURE:</strong> Local contribution is only ${communityPercentage.toFixed(2)}%. You need an additional <strong>E${deficit.toFixed(2)}</strong> in value/cash to hit the mandatory 10% threshold.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            eligible = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        outputHTML += `<p>✅ <strong>FINANCIAL THRESHOLD:</strong> Local contribution hits ${communityPercentage.toFixed(2)}% (Meets the 10% regulation requirement).</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Viability Check: Income vs Expense (Page 7)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (netProfit <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            outputHTML += `<p>❌ <strong>VIABILITY WARNING:</strong> Projections are unprofitable. Total monthly expenditures (E${totalExpenses.toFixed(2)}) equal or exceed projected income.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    eligible = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const resultBox = document.getElementById('resultBox');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                resultBox.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!eligible) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resultBox.className = "result-box fail";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultBox.innerHTML = outputHTML + "<p><strong>Result: Application Unviable. Correct flagged items above.</strong></p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 3. If Successful, Generate Business Plan Text Block
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultBox.className = "result-box pass";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            outputHTML += "<p>🎉 <strong>SUCCESS: Criteria Passed! Copy the Business Plan below:</strong></p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let planText = `6.0 DETAILS OF INCOME AND EXPENDITURE FOR ${groupName}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        planText += `------------------------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            planText += `MONTHLY INCOME PROJECTIONS:\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                planText += `Activity: ${projectDesc}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    planText += `Expected Monthly Sales Volume: ${units} units\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        planText += `Target Price per Unit: E${price.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            planText += `TOTAL PROJECTED MONTHLY GROSS INCOME: E${grossIncome.toFixed(2)}\n\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                planText += `MONTHLY EXPENDITURE BREAKDOWN:\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    planText += `- Transport Cost: E${transport.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        planText += `- Labour Cost: E${opLabour.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            planText += `- Others (Overhead): E${otherExp.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                planText += `TOTAL PROJECTED MONTHLY EXPENDITURE: E${totalExpenses.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    planText += `------------------------------------------------------------------\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        planText += `PROJECTED NET MONTHLY NET PROFIT: E${netProfit.toFixed(2)}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            planText += `------------------------------------------------------------------\n`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                outputHTML += `<pre>${planText}</pre>`;
